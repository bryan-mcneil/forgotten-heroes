# Settings that apply only when the "prod" profile is active (the Lambda, from Step 33).
springdoc:
  # the contract is exported at build time; the live API does not describe itself to strangers
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # no fallback in prod: the Lambda must be told its pool (Step 33 sets COGNITO_ISSUER) or it refuses to start
          issuer-uri: ${COGNITO_ISSUER}
